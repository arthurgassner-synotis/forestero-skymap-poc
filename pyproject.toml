[project]
name = "forestero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.9.1",
    "dask>=2026.3.0",
    "dask-gateway>=2026.3.0",
    "earthengine-api>=1.7.21",
    "fastparquet>=2026.5.0",
    "geodatasets>=2026.1.0",
    "geopandas>=1.1.2",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "osmnx>=2.1.0",
    "pandas>=3.0.0",
    "planetary-computer>=1.0.0",
    "pre-commit>=4.5.1",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.0",
    "rioxarray>=0.22.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "spatial-kfold>=0.0.4",
    "stackstac>=0.5.0",
    "tqdm>=4.67.3",
    "xarray>=2026.2.0",
    "xarray-spatial>=0.10.6",
    "zarr>=3.2.1",
]

[tool.ruff]
target-version = "py313"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
